name: CPT Audit Telemetry Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'audit_batch_*.json'
      - 'parse_and_raise_issue.sh'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Script Executable
        run: chmod +x parse_and_raise_issue.sh

      - name: Run Telemetry Audit Across Batch Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          THRESHOLD_MINS: 15
        run: |
          echo "==> Scanning for audit payload files..."
          FOUND=0
          for file in audit_batch_*.json; do
            if [ -f "$file" ]; then
              echo "==> Executing audit pipeline for: $file"
              ./parse_and_raise_issue.sh "$file"
              FOUND=1
            fi
          done
          
          if [ "$FOUND" -eq 0 ]; then
            echo "==> No audit_batch_*.json files found."
          fi
